<svg fill="none" viewBox="0 0 1000 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>

    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.3" />
    </pattern>

    <!-- Filters for Glow Effects -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSubtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(0.8); opacity: 0.2; }
      50% { transform: translateY(-20px) scale(1.1); opacity: 0.7; }
      100% { transform: translateY(0px) scale(0.8); opacity: 0.2; }
    }
    @keyframes pulseBeam {
      0% { stroke-dashoffset: 400; opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }
    @keyframes sweepGlow {
      0% { transform: translateX(-150px); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateX(850px); opacity: 0; }
    }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 4s; }
    .flow-line { stroke-dasharray: 20 15; animation: pulseBeam 12s linear infinite; }
    .glow-runner { animation: sweepGlow 8s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="260" rx="16" fill="url(#bgGrad)" />
  <rect width="1000" height="260" rx="16" fill="url(#grid)" />
  
  <!-- Outer Border -->
  <rect width="998" height="258" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Dynamic Ambient Background Glow Elements (behind text) -->
  <g opacity="0.6">
    <circle cx="150" cy="50" r="120" fill="#00f2fe" filter="url(#neonBlur)" opacity="0.12" />
    <circle cx="850" cy="210" r="140" fill="#7f00ff" filter="url(#neonBlur)" opacity="0.15" />
    <circle cx="500" cy="130" r="90" fill="#ff0844" filter="url(#neonBlur)" opacity="0.08" />
  </g>

  <!-- Animated Data Flows / Wave Lines (Background Layer) -->
  <g opacity="0.4">
    <path class="flow-line" d="M 0 60 Q 250 120 500 50 T 1000 70" fill="none" stroke="#00f2fe" stroke-width="2" />
    <path class="flow-line" d="M 0 210 Q 300 150 600 220 T 1000 180" fill="none" stroke="#7f00ff" stroke-width="2" />
    <path class="flow-line" d="M 0 140 Q 200 80 500 140 T 1000 130" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.5" />
  </g>

  <!-- Floating Memory Nodes/Particles -->
  <circle class="particle-1" cx="200" cy="40" r="4" fill="#00f2fe" />
  <circle class="particle-2" cx="820" cy="60" r="5" fill="#38bdf8" />
  <circle class="particle-3" cx="120" cy="220" r="6" fill="#a855f7" />
  <circle class="particle-1" cx="890" cy="180" r="4.5" fill="#f43f5e" />
  <circle class="particle-2" cx="450" cy="235" r="3.5" fill="#00f2fe" />

  <!-- Sweeping Laser Beam in Background -->
  <rect class="glow-runner" y="254" width="250" height="3" fill="url(#primaryGlow)" filter="url(#glowSubtle)" />

  <!-- Foreground Content: Pill Badge -->
  <g transform="translate(50, 36)">
    <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="14" cy="14" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">ULTRA-LOW LATENCY RAM</text>
  </g>

  <!-- Pill Badge 2 (Right side) -->
  <g transform="translate(735, 36)">
    <rect width="215" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="14" cy="14" r="5" fill="#a855f7" />
    <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CACHES &bull; GRIDS &bull; STORES</text>
  </g>

  <!-- Foreground Hero Title -->
  <g transform="translate(50, 115)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#ffffff">Awesome </tspan>
      <tspan fill="url(#primaryGlow)">In-Memory Data Stores</tspan>
    </text>
  </g>

  <!-- Foreground Subtitle / Tagline -->
  <g transform="translate(50, 150)">
    <text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      Curated ecosystem of microsecond distributed caches, in-memory data grids (IMDG), and self-hosted stores
    </text>
  </g>

  <!-- Interactive/Feature Badges Along Bottom Foreground -->
  <g transform="translate(50, 185)">
    <!-- Feature 1: Sub-millisecond -->
    <rect width="135" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ &lt;1ms Latency</text>

    <!-- Feature 2: High Throughput -->
    <g transform="translate(145, 0)">
      <rect width="150" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="19" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🚀 Million+ IOPS</text>
    </g>

    <!-- Feature 3: ACID & Grids -->
    <g transform="translate(305, 0)">
      <rect width="155" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="19" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🛡️ Distributed ACID</text>
    </g>

    <!-- Feature 4: OSS & Managed -->
    <g transform="translate(470, 0)">
      <rect width="150" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="19" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🌐 Cloud &amp; Self-Host</text>
    </g>
  </g>
</svg>
